<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Mob Rush</title>
  <meta name="description" content="Dispara tu ejército, multiplícalo en las puertas y derriba la base enemiga.">
  <meta name="theme-color" content="#1d4fd6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mob Rush">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="flash" class="flash"></div>

  <div id="hud">
    <div class="top">
      <div class="pill" id="lvl">Nivel 1</div>
      <div class="basebar"><div id="basefill"></div><span id="basehp"></span></div>
      <div class="pill coins"><i></i><span id="coins">0</span></div>
    </div>
    <button id="mute" class="icon" aria-label="Sonido">🔊</button>
    <button id="giant" class="giant" aria-label="Lanzar gigante"><span>GIGANTE</span></button>
  </div>

  <div id="overlay" class="overlay show">
    <div class="panel">
      <h1 id="ov-title">Mob Rush</h1>
      <p id="ov-sub">Arrastra para apuntar · mantén pulsado para disparar</p>
      <div class="upgrades">
        <button id="up-rate" class="up"><b>Cadencia</b><small></small><em></em></button>
        <button id="up-giant" class="up"><b>Gigante</b><small></small><em></em></button>
      </div>
      <button id="play" class="primary">Jugar</button>
    </div>
  </div>

  <div id="loader" class="loader"><b>Mob Rush</b><span>Cargando…</span></div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
  <script type="module" src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
