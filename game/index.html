<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Mob Rush</title>
  <meta name="description" content="Dispara tu ejército, multiplícalo en las puertas, invoca héroes y derriba la fortaleza enemiga.">
  <meta name="theme-color" content="#1d4fd6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mob Rush">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="popups"></div>
  <div id="flash" class="flash"></div>

  <div id="hud">
    <div class="top">
      <div class="pill" id="lvl">Nivel 1</div>
      <div class="basebar"><div id="basefill"></div><span id="basehp"></span></div>
      <div class="pill coins"><i></i><span id="coins">0</span></div>
    </div>
    <div id="stages" class="stages"></div>
    <div id="wallhud" class="wallhud hidden">🧱 <span></span></div>
    <div id="banner" class="banner"><b></b><span></span></div>
    <button id="mute" class="icon" aria-label="Sonido">🔊</button>
    <button id="giant" class="giant" aria-label="Lanzar héroe"><img alt=""><span>HÉROE</span></button>
  </div>

  <div id="overlay" class="overlay show">
    <div class="panel">
      <nav class="tabs">
        <button data-tab="battle" class="on">⚔️ Batalla</button>
        <button data-tab="heroes">🦸 Héroes</button>
        <button data-tab="kingdom">🏰 Reino</button>
      </nav>

      <section class="tab on" id="tab-battle">
        <h1 id="ov-title">Mob Rush</h1>
        <p id="ov-sub"></p>
        <div class="equipped" id="equipped">
          <img alt="">
          <div><small>Héroe equipado</small><b></b><span></span></div>
        </div>
        <button id="play" class="primary">Jugar</button>
        <button id="quality" class="qbtn"></button>
      </section>

      <section class="tab" id="tab-heroes">
        <div class="hero-grid" id="hero-grid"></div>
        <button id="summon" class="primary summon">✨ Invocar héroe <em></em></button>
      </section>

      <section class="tab" id="tab-kingdom">
        <div class="build-list" id="build-list"></div>
      </section>

      <div class="wallet"><i></i><span id="ov-coins">0</span></div>
    </div>
  </div>

  <div id="reveal" class="reveal">
    <div class="reveal-card">
      <div class="rays"></div>
      <img alt="">
      <em></em>
      <b></b>
      <span></span>
      <button class="primary">¡A la batalla!</button>
    </div>
  </div>

  <div id="loader" class="loader">
    <b>Mob Rush</b><span>Forjando el reino…</span>
    <small id="boot-error"></small>
    <button id="boot-fix" class="primary hidden">Reparar y recargar</button>
  </div>
  <script>
    // Si el juego no arranca (archivos de versiones distintas en caché, error de carga…),
    // muestra el motivo y permite limpiar la caché y recargar.
    (function () {
      var shown = false;
      function fail(msg) {
        if (window.__booted || shown) return;
        shown = true;
        var e = document.getElementById('boot-error');
        if (/webgl/i.test(msg || '')) {
          e.innerHTML = '<b style="font-size:16px">El navegador ha bloqueado los gráficos 3D</b><br>'
            + 'Suele pasar después de un fallo de la tarjeta gráfica. Cierra el navegador del todo '
            + '(quítalo de las apps recientes) o reinicia el móvil y vuelve a abrir el juego.<br>'
            + 'Si sigue igual, en Chrome abre chrome://flags y comprueba que «WebGL» no esté desactivado.';
        } else {
          e.textContent = msg ? 'No se pudo arrancar: ' + msg : 'Está tardando demasiado.';
        }
        document.getElementById('boot-fix').classList.remove('hidden');
      }
      window.__bootFail = function (err) { fail(String((err && err.message) || err)); };
      window.addEventListener('error', function (ev) {
        var tag = ev.target && ev.target.tagName;
        if (tag && tag !== 'SCRIPT') return;
        fail(ev.message || 'error al cargar ' + ((ev.target && ev.target.src) || ''));
      }, true);
      window.addEventListener('unhandledrejection', function (ev) { fail(String((ev.reason && ev.reason.message) || ev.reason)); });
      setTimeout(function () { fail(''); }, 25000);
      document.getElementById('boot-fix').addEventListener('click', function () {
        var btn = document.getElementById('boot-fix');
        btn.textContent = 'Reparando…';
        btn.disabled = true;
        var go = function () { location.replace(location.pathname + '?r=' + Date.now()); };
        setTimeout(go, 2500);
        var jobs = [];
        if ('serviceWorker' in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
        if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
        Promise.all(jobs).then(go, go);
      });
    })();
  </script>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
  <script type="module" src="js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
